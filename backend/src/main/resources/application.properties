# ========================
# CertiChain Configuration
# ========================

spring.application.name=CertiChain

# H2 Database (file-persisted)
spring.datasource.url=jdbc:h2:file:./data/certichain;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
jwt.secret=certichain-super-secret-key-change-in-production-min-256-bits-long-key
jwt.expiration=86400000

# Server
server.port=8080

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Certificate storage
certichain.certificates.storage-path=./data/certificates
certichain.base-url=http://localhost:8080

# Logging
logging.level.com.certichain=INFO
spring.jackson.serialization.write-dates-as-timestamps=false

# Initialize seed data
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true
